<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="dronAIcharya — your AI guru, learn as you build">
  <!--
    SOCIAL CARD — 1200x630 (Open Graph / Twitter summary_large_image).
    EXPORT NOTES
      • Fonts are converted to system fallbacks here so the SVG renders without a
        network fetch. For a pixel-perfect PNG that matches the site, install
        "Inter" locally first, then export.
      • To rasterize:
          rsvg-convert -w 1200 -h 630 social-card.svg -o social-card.png
          # or: npx -y sharp-cli -i social-card.svg -o social-card.png
          # or: open in Figma/Illustrator and export PNG at 1x (1200x630).
      • Reference it with:  <meta property="og:image" content=".../assets/social-card.png">
        (most scrapers want PNG/JPG, not SVG). Keep the PNG < 1 MB.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1630"/>
      <stop offset="1" stop-color="#0A1226"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(230 150) rotate(35) scale(460 380)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#388BFD" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#388BFD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(1000 500) rotate(-40) scale(460 380)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lens" cx="0.5" cy="0.46" r="0.62" gradientUnits="objectBoundingBox">
      <stop stop-color="#60A5FA" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>
  <rect x="6" y="6" width="1188" height="618" rx="28" stroke="#22304F" stroke-width="2"/>

  <!-- precision lens on the right -->
  <g transform="translate(975 300)">
    <circle r="150" fill="url(#lens)"/>
    <circle r="118" stroke="#6E8CC0" stroke-width="3.5"/>
    <circle r="78" stroke="#3B82F6" stroke-width="4.5"/>
    <circle r="40" stroke="#9DC0FF" stroke-width="3.5"/>
    <circle r="11" fill="#60A5FA"/>
    <path d="M0 -150v26M0 124v26M-150 0h26M124 0h26" stroke="#3B82F6" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- wordmark + tagline -->
  <g transform="translate(90 190)">
    <text x="0" y="0" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="92" letter-spacing="-3">
      <tspan fill="#EAF0FB">dron</tspan><tspan fill="#60A5FA">AI</tspan><tspan fill="#EAF0FB">charya</tspan>
    </text>
    <text x="4" y="66" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="40" fill="#C6D6F2" letter-spacing="-1">
      Your AI guru — learn as you build.
    </text>
    <text x="4" y="150" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="400" font-size="27" fill="#9FB2D6">
      <tspan x="4" dy="0">A Claude Code plugin that teaches you while it builds</tspan>
      <tspan x="4" dy="40">real software with you — and checks that you get it.</tspan>
    </text>
    <g transform="translate(4 250)">
      <rect width="400" height="52" rx="26" fill="#2563EB"/>
      <text x="200" y="34" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="22" fill="#FFFFFF">/dronaicharya:start</text>
      <text x="430" y="34" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="500" font-size="20" fill="#8294B8">MIT · No telemetry</text>
    </g>
  </g>
</svg>
